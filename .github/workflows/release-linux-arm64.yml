name: Linux ARM64 Release

# Native ARM64 packaging is separate from the Gitea x64 release builder. It
# uploads its two assets to the same draft release before Gitea publishes it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to package'
        type: string
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  release-linux-arm64:
    name: Linux ARM64 Release
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate requested tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]
      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then exit 0; fi
          mkdir -p out/releases
          python3 tools/release/extract_release_notes.py --changelog CHANGELOG.md --version "$RELEASE_TAG" --output out/releases/release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file out/releases/release-notes.md
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang clang-format lld cmake g++ libcurl4-openssl-dev libvulkan-dev pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev libegl-dev \
            libdecor-0-dev libdbus-1-dev libudev-dev libedit-dev libncurses-dev libxml2-dev zlib1g-dev file wget flatpak
          python -m pip install 'cmake==3.31.6' -r tools/release/requirements.txt
      - name: Retrieve private build input
        uses: actions/checkout@v4
        with:
          repository: freefrank/LostOdysseyRecomp-build-inputs
          ref: 77f076e0e03966736cbf8919ce793bafadce82d9
          path: out/build-input
          sparse-checkout: /default.xex
          sparse-checkout-cone-mode: false
          ssh-key: ${{ secrets.LO_BUILD_INPUT_KEY }}
          persist-credentials: false
      - name: Verify and patch build inputs
        env:
          LO_BUILD_XEX_PATH: out/build-input/default.xex
        run: |
          python tools/release/fetch_build_input.py
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-lostodyssey.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-sdl3.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-sdl3.patch
      - name: Generate game code
        run: |
          cmake -S tools/xexdump -B out/build/tools -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out/build/tools --target XenonRecomp XenonAnalyse xexdump --parallel 2
          out/build/tools/xexdump LostOdysseyRecompLib/private/disc1/default.xex LostOdysseyRecompLib/private/image_disc1.bin
          python tools/ppc_codegen.py generate --executable out/build/tools/XenonRecomp/XenonRecomp/XenonRecomp
      - name: Build ARM64 DXC and runtime
        run: |
          tools/build_dxc_linux_arm64.sh
          tools/build_linux_arm64.sh
      - name: Install linuxdeploy
        run: |
          mkdir -p out/tools/linuxdeploy
          wget -q -O out/tools/linuxdeploy/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          chmod +x out/tools/linuxdeploy/linuxdeploy
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          python tools/package_appimage.py --build out/build/linux-arm64 --output out/releases --appdir out/releases/linux-arm64.AppDir --version "$RELEASE_TAG" --architecture arm64 --linuxdeploy out/tools/linuxdeploy/linuxdeploy
      - name: Package Flatpak
        run: |
          sudo flatpak --system remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak --system install -y --noninteractive flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08
          python tools/package_flatpak.py --appdir out/releases/linux-arm64.AppDir --output out/flatpak --version "$RELEASE_TAG" --architecture arm64
      - name: Upload ARM64 assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" out/releases/LostOdysseyRecomp-linux-arm64-"$RELEASE_TAG".AppImage out/flatpak/LostOdysseyRecomp-linux-arm64-"$RELEASE_TAG".flatpak --clobber
